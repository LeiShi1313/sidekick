x-wechat-ai: &wechat-ai
  build:
    context: .
  image: sidekick-adapter:local
  command: ["python", "-m", "sidekick.cli", "wechat", "ai"]
  environment: &wechat-ai-environment
    PYTHONPATH: /app/src
    HOME: /sidekick-data
    SIDEKICK_PI_URL: http://pi-agent:8790
    SIDEKICK_PI_TOKEN: ${SIDEKICK_PI_TOKEN}
    SIDEKICK_OPS_HOST: 0.0.0.0
    SIDEKICK_OPS_PORT: ${SIDEKICK_OPS_PORT:-8781}
    SIDEKICK_PI_RUN_TIMEOUT: ${SIDEKICK_PI_RUN_TIMEOUT:-300}
    SIDEKICK_HINDSIGHT_URL: http://memory-api:8888
    SIDEKICK_HINDSIGHT_TIMEOUT: ${SIDEKICK_HINDSIGHT_TIMEOUT:-90}
    SIDEKICK_MEMORY_DREAM_LOOKBACK_HOURS: ${SIDEKICK_MEMORY_DREAM_LOOKBACK_HOURS:-24}
    SIDEKICK_MEMORY_DREAM_OVERLAP_SECONDS: ${SIDEKICK_MEMORY_DREAM_OVERLAP_SECONDS:-600}
    SIDEKICK_MEMORY_INGESTION_SETTLEMENT_SECONDS: ${SIDEKICK_MEMORY_INGESTION_SETTLEMENT_SECONDS:-30}
    SIDEKICK_MEMORY_INGESTION_MAX_MESSAGES: ${SIDEKICK_MEMORY_INGESTION_MAX_MESSAGES:-500}
    SIDEKICK_MEMORY_INGESTION_MAX_THREAD_MESSAGES: ${SIDEKICK_MEMORY_INGESTION_MAX_THREAD_MESSAGES:-100}
    SIDEKICK_MEMORY_SEGMENT_IDLE_SECONDS: ${SIDEKICK_MEMORY_SEGMENT_IDLE_SECONDS:-300}
    SIDEKICK_MEMORY_SEGMENT_MAX_SPAN_SECONDS: ${SIDEKICK_MEMORY_SEGMENT_MAX_SPAN_SECONDS:-3600}
    SIDEKICK_MEMORY_SEGMENT_MAX_EVENTS: ${SIDEKICK_MEMORY_SEGMENT_MAX_EVENTS:-30}
    SIDEKICK_MEMORY_SEGMENT_MAX_CHARS: ${SIDEKICK_MEMORY_SEGMENT_MAX_CHARS:-4000}
    SIDEKICK_MEMORY_INGESTION_RETAIN_CONCURRENCY: ${SIDEKICK_MEMORY_INGESTION_RETAIN_CONCURRENCY:-4}
    SIDEKICK_MEMORY_INGESTION_PREPROCESS_CONCURRENCY: ${SIDEKICK_MEMORY_INGESTION_PREPROCESS_CONCURRENCY:-12}
    SIDEKICK_MEMORY_DREAM_CYCLE_BUDGET_SECONDS: ${SIDEKICK_MEMORY_DREAM_CYCLE_BUDGET_SECONDS:-50}
    SIDEKICK_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS: ${SIDEKICK_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS:-300}
    SIDEKICK_MEMORY_DREAM_CRON: ${SIDEKICK_MEMORY_DREAM_CRON:-0 * * * *}
    SIDEKICK_MEMORY_DREAM_CONCURRENCY: ${SIDEKICK_MEMORY_DREAM_CONCURRENCY:-2}
    SIDEKICK_MEMORY_DREAM_SCOPE_BATCH_SIZE: ${SIDEKICK_MEMORY_DREAM_SCOPE_BATCH_SIZE:-20}
    SIDEKICK_MEMORY_INGESTION_LEASE_SECONDS: ${SIDEKICK_MEMORY_INGESTION_LEASE_SECONDS:-3600}
    SIDEKICK_MEMORY_INGESTION_RETRY_ATTEMPTS: ${SIDEKICK_MEMORY_INGESTION_RETRY_ATTEMPTS:-3}
    SIDEKICK_MEMORY_INGESTION_MAX_RETRY_DELAY: ${SIDEKICK_MEMORY_INGESTION_MAX_RETRY_DELAY:-30}
    SIDEKICK_MEMORY_CONTINUOUS_POLL_SECONDS: ${SIDEKICK_MEMORY_CONTINUOUS_POLL_SECONDS:-10}
    SIDEKICK_MEMORY_CONTINUOUS_CONCURRENCY: ${SIDEKICK_MEMORY_CONTINUOUS_CONCURRENCY:-2}
    SIDEKICK_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE: ${SIDEKICK_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE:-20}
    SIDEKICK_AI_MAX_OUTPUT_CHARS: ${SIDEKICK_WECHAT_MAX_OUTPUT_CHARS:-3900}
    SIDEKICK_AI_EDIT_CADENCE: ${SIDEKICK_AI_EDIT_CADENCE:-4.0}
    SIDEKICK_MEMORY_COMMAND_DELETE_DELAY: ${SIDEKICK_MEMORY_COMMAND_DELETE_DELAY:-3}
    SIDEKICK_AI_SYSTEM_PROMPT: ${SIDEKICK_AI_SYSTEM_PROMPT:-}
    SIDEKICK_AI_MAX_CONTEXT_MESSAGES: ${SIDEKICK_AI_MAX_CONTEXT_MESSAGES:-20}
    SIDEKICK_AI_MAX_CONTEXT_CHARS: ${SIDEKICK_AI_MAX_CONTEXT_CHARS:-12000}
    SIDEKICK_AI_DELEGATED_COOLDOWN: ${SIDEKICK_AI_DELEGATED_COOLDOWN:-30}
    SIDEKICK_WECHAT_RECONNECT_DELAY: ${SIDEKICK_WECHAT_RECONNECT_DELAY:-2}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
  pids_limit: 256
  expose:
    - "${SIDEKICK_OPS_PORT:-8781}"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - |-
        import asyncio
        import os
        from sidekick.wechat.api import WeChatConnectorClient

        async def check():
            client = WeChatConnectorClient(
                os.environ["SIDEKICK_WECHAT_URL"],
                token=os.environ.get("SIDEKICK_WECHAT_TOKEN", ""),
                timeout=4,
            )
            try:
                session, capabilities, chats, _messages = await asyncio.gather(
                    client.get_session(),
                    client.get_capabilities(),
                    client.get_chats(),
                    client.get_messages(limit=1_000),
                )
                session.require_current_login()
                capabilities.require_ai_channel()
                chats.require_current(session.connection_generation)
            finally:
                await client.close()

        asyncio.run(check())
    interval: 30s
    timeout: 10s
    retries: 4
    start_period: 20s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "2"
  restart: unless-stopped

services:
  ai:
    build:
      context: .
    image: sidekick-adapter:local
    container_name: sidekick-ai
    command: ["python", "-m", "sidekick.cli", "telegram", "ai", "--account", "default"]
    environment:
      PYTHONPATH: /app/src
      HOME: /sidekick-data
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      SIDEKICK_PI_URL: http://pi-agent:8790
      SIDEKICK_PI_TOKEN: ${SIDEKICK_PI_TOKEN}
      SIDEKICK_OPS_HOST: 0.0.0.0
      SIDEKICK_OPS_PORT: ${SIDEKICK_OPS_PORT:-8781}
      SIDEKICK_ADAPTER_INSTANCE_ID: ${SIDEKICK_TELEGRAM_INSTANCE_ID:-telegram-default}
      SIDEKICK_PI_RUN_TIMEOUT: ${SIDEKICK_PI_RUN_TIMEOUT:-300}
      SIDEKICK_HINDSIGHT_URL: http://memory-api:8888
      SIDEKICK_HINDSIGHT_TIMEOUT: ${SIDEKICK_HINDSIGHT_TIMEOUT:-90}
      SIDEKICK_MEMORY_DREAM_LOOKBACK_HOURS: ${SIDEKICK_MEMORY_DREAM_LOOKBACK_HOURS:-24}
      SIDEKICK_MEMORY_DREAM_OVERLAP_SECONDS: ${SIDEKICK_MEMORY_DREAM_OVERLAP_SECONDS:-600}
      SIDEKICK_MEMORY_INGESTION_SETTLEMENT_SECONDS: ${SIDEKICK_MEMORY_INGESTION_SETTLEMENT_SECONDS:-30}
      SIDEKICK_MEMORY_INGESTION_MAX_MESSAGES: ${SIDEKICK_MEMORY_INGESTION_MAX_MESSAGES:-500}
      SIDEKICK_MEMORY_INGESTION_MAX_THREAD_MESSAGES: ${SIDEKICK_MEMORY_INGESTION_MAX_THREAD_MESSAGES:-100}
      SIDEKICK_MEMORY_SEGMENT_IDLE_SECONDS: ${SIDEKICK_MEMORY_SEGMENT_IDLE_SECONDS:-300}
      SIDEKICK_MEMORY_SEGMENT_MAX_SPAN_SECONDS: ${SIDEKICK_MEMORY_SEGMENT_MAX_SPAN_SECONDS:-3600}
      SIDEKICK_MEMORY_SEGMENT_MAX_EVENTS: ${SIDEKICK_MEMORY_SEGMENT_MAX_EVENTS:-30}
      SIDEKICK_MEMORY_SEGMENT_MAX_CHARS: ${SIDEKICK_MEMORY_SEGMENT_MAX_CHARS:-4000}
      SIDEKICK_MEMORY_INGESTION_RETAIN_CONCURRENCY: ${SIDEKICK_MEMORY_INGESTION_RETAIN_CONCURRENCY:-4}
      SIDEKICK_MEMORY_INGESTION_PREPROCESS_CONCURRENCY: ${SIDEKICK_MEMORY_INGESTION_PREPROCESS_CONCURRENCY:-12}
      SIDEKICK_MEMORY_DREAM_CYCLE_BUDGET_SECONDS: ${SIDEKICK_MEMORY_DREAM_CYCLE_BUDGET_SECONDS:-50}
      SIDEKICK_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS: ${SIDEKICK_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS:-300}
      SIDEKICK_MEMORY_DREAM_CRON: ${SIDEKICK_MEMORY_DREAM_CRON:-0 * * * *}
      SIDEKICK_MEMORY_DREAM_CONCURRENCY: ${SIDEKICK_MEMORY_DREAM_CONCURRENCY:-2}
      SIDEKICK_MEMORY_DREAM_SCOPE_BATCH_SIZE: ${SIDEKICK_MEMORY_DREAM_SCOPE_BATCH_SIZE:-20}
      SIDEKICK_MEMORY_INGESTION_LEASE_SECONDS: ${SIDEKICK_MEMORY_INGESTION_LEASE_SECONDS:-3600}
      SIDEKICK_MEMORY_INGESTION_RETRY_ATTEMPTS: ${SIDEKICK_MEMORY_INGESTION_RETRY_ATTEMPTS:-3}
      SIDEKICK_MEMORY_INGESTION_MAX_RETRY_DELAY: ${SIDEKICK_MEMORY_INGESTION_MAX_RETRY_DELAY:-30}
      SIDEKICK_MEMORY_CONTINUOUS_POLL_SECONDS: ${SIDEKICK_MEMORY_CONTINUOUS_POLL_SECONDS:-10}
      SIDEKICK_MEMORY_CONTINUOUS_CONCURRENCY: ${SIDEKICK_MEMORY_CONTINUOUS_CONCURRENCY:-2}
      SIDEKICK_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE: ${SIDEKICK_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE:-20}
      SIDEKICK_AI_STATE_PATH: /sidekick-data/.sidekick/ai.db
      SIDEKICK_AI_MAX_OUTPUT_CHARS: ${SIDEKICK_AI_MAX_OUTPUT_CHARS:-3900}
      SIDEKICK_AI_EDIT_CADENCE: ${SIDEKICK_AI_EDIT_CADENCE:-4.0}
      SIDEKICK_MEMORY_COMMAND_DELETE_DELAY: ${SIDEKICK_MEMORY_COMMAND_DELETE_DELAY:-3}
      SIDEKICK_AI_SYSTEM_PROMPT: ${SIDEKICK_AI_SYSTEM_PROMPT:-}
      SIDEKICK_AI_MAX_CONTEXT_MESSAGES: ${SIDEKICK_AI_MAX_CONTEXT_MESSAGES:-20}
      SIDEKICK_AI_MAX_CONTEXT_CHARS: ${SIDEKICK_AI_MAX_CONTEXT_CHARS:-12000}
      SIDEKICK_AI_DELEGATED_COOLDOWN: ${SIDEKICK_AI_DELEGATED_COOLDOWN:-30}
    volumes:
      - sidekick-runtime:/sidekick-data
    networks:
      - memory-platform
      - agent-platform
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 256
    expose:
      - "${SIDEKICK_OPS_PORT:-8781}"
    restart: unless-stopped

  onebot-ai:
    build:
      context: .
    image: sidekick-adapter:local
    container_name: sidekick-onebot-ai
    command: ["python", "-m", "sidekick.cli", "onebot", "ai"]
    environment:
      PYTHONPATH: /app/src
      HOME: /sidekick-data
      SIDEKICK_ONEBOT_HOST: 0.0.0.0
      SIDEKICK_ONEBOT_PORT: 8766
      SIDEKICK_ONEBOT_ADMIN_URL: http://127.0.0.1:8766
      SIDEKICK_ONEBOT_TOKEN: ${SIDEKICK_ONEBOT_TOKEN}
      SIDEKICK_ONEBOT_SELF_ID: ${SIDEKICK_ONEBOT_SELF_ID}
      SIDEKICK_PI_URL: http://pi-agent:8790
      SIDEKICK_PI_TOKEN: ${SIDEKICK_PI_TOKEN}
      SIDEKICK_OPS_HOST: 0.0.0.0
      SIDEKICK_OPS_PORT: ${SIDEKICK_OPS_PORT:-8781}
      SIDEKICK_ADAPTER_INSTANCE_ID: ${SIDEKICK_ONEBOT_INSTANCE_ID:-qq-default}
      SIDEKICK_PI_RUN_TIMEOUT: ${SIDEKICK_PI_RUN_TIMEOUT:-300}
      SIDEKICK_HINDSIGHT_URL: http://memory-api:8888
      SIDEKICK_HINDSIGHT_TIMEOUT: ${SIDEKICK_HINDSIGHT_TIMEOUT:-90}
      SIDEKICK_MEMORY_DREAM_LOOKBACK_HOURS: ${SIDEKICK_MEMORY_DREAM_LOOKBACK_HOURS:-24}
      SIDEKICK_MEMORY_DREAM_OVERLAP_SECONDS: ${SIDEKICK_MEMORY_DREAM_OVERLAP_SECONDS:-600}
      SIDEKICK_MEMORY_INGESTION_SETTLEMENT_SECONDS: ${SIDEKICK_MEMORY_INGESTION_SETTLEMENT_SECONDS:-30}
      SIDEKICK_MEMORY_INGESTION_MAX_MESSAGES: ${SIDEKICK_MEMORY_INGESTION_MAX_MESSAGES:-500}
      SIDEKICK_MEMORY_INGESTION_MAX_THREAD_MESSAGES: ${SIDEKICK_MEMORY_INGESTION_MAX_THREAD_MESSAGES:-100}
      SIDEKICK_MEMORY_SEGMENT_IDLE_SECONDS: ${SIDEKICK_MEMORY_SEGMENT_IDLE_SECONDS:-300}
      SIDEKICK_MEMORY_SEGMENT_MAX_SPAN_SECONDS: ${SIDEKICK_MEMORY_SEGMENT_MAX_SPAN_SECONDS:-3600}
      SIDEKICK_MEMORY_SEGMENT_MAX_EVENTS: ${SIDEKICK_MEMORY_SEGMENT_MAX_EVENTS:-30}
      SIDEKICK_MEMORY_SEGMENT_MAX_CHARS: ${SIDEKICK_MEMORY_SEGMENT_MAX_CHARS:-4000}
      SIDEKICK_MEMORY_INGESTION_RETAIN_CONCURRENCY: ${SIDEKICK_MEMORY_INGESTION_RETAIN_CONCURRENCY:-4}
      SIDEKICK_MEMORY_INGESTION_PREPROCESS_CONCURRENCY: ${SIDEKICK_MEMORY_INGESTION_PREPROCESS_CONCURRENCY:-12}
      SIDEKICK_MEMORY_DREAM_CYCLE_BUDGET_SECONDS: ${SIDEKICK_MEMORY_DREAM_CYCLE_BUDGET_SECONDS:-50}
      SIDEKICK_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS: ${SIDEKICK_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS:-300}
      SIDEKICK_MEMORY_DREAM_CRON: ${SIDEKICK_MEMORY_DREAM_CRON:-0 * * * *}
      SIDEKICK_MEMORY_DREAM_CONCURRENCY: ${SIDEKICK_MEMORY_DREAM_CONCURRENCY:-2}
      SIDEKICK_MEMORY_DREAM_SCOPE_BATCH_SIZE: ${SIDEKICK_MEMORY_DREAM_SCOPE_BATCH_SIZE:-20}
      SIDEKICK_MEMORY_INGESTION_LEASE_SECONDS: ${SIDEKICK_MEMORY_INGESTION_LEASE_SECONDS:-3600}
      SIDEKICK_MEMORY_INGESTION_RETRY_ATTEMPTS: ${SIDEKICK_MEMORY_INGESTION_RETRY_ATTEMPTS:-3}
      SIDEKICK_MEMORY_INGESTION_MAX_RETRY_DELAY: ${SIDEKICK_MEMORY_INGESTION_MAX_RETRY_DELAY:-30}
      SIDEKICK_MEMORY_CONTINUOUS_POLL_SECONDS: ${SIDEKICK_MEMORY_CONTINUOUS_POLL_SECONDS:-10}
      SIDEKICK_MEMORY_CONTINUOUS_CONCURRENCY: ${SIDEKICK_MEMORY_CONTINUOUS_CONCURRENCY:-2}
      SIDEKICK_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE: ${SIDEKICK_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE:-20}
      SIDEKICK_AI_STATE_PATH: /sidekick-data/.sidekick/onebot-ai.db
      SIDEKICK_AI_MAX_OUTPUT_CHARS: ${SIDEKICK_ONEBOT_MAX_OUTPUT_CHARS:-3900}
      SIDEKICK_MEMORY_COMMAND_DELETE_DELAY: ${SIDEKICK_MEMORY_COMMAND_DELETE_DELAY:-3}
      SIDEKICK_AI_SYSTEM_PROMPT: ${SIDEKICK_AI_SYSTEM_PROMPT:-}
      SIDEKICK_AI_MAX_CONTEXT_MESSAGES: ${SIDEKICK_AI_MAX_CONTEXT_MESSAGES:-20}
      SIDEKICK_AI_MAX_CONTEXT_CHARS: ${SIDEKICK_AI_MAX_CONTEXT_CHARS:-12000}
