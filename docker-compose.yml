    pids_limit: 256
    expose:
      - "${SIDEKICK_OPS_PORT:-8781}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=2).read()
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

  wechat-host-ai:
    <<: *wechat-ai
    container_name: sidekick-wechat-host-ai
    environment:
      <<: *wechat-ai-environment
      SIDEKICK_WECHAT_URL: http://wechat:18088
      SIDEKICK_WECHAT_TOKEN: ${SIDEKICK_WECHAT_HOST_TOKEN:-}
      SIDEKICK_WECHAT_STATE_PATH: /sidekick-data/.sidekick/wechat-host.db
      SIDEKICK_AI_STATE_PATH: /sidekick-data/.sidekick/wechat-host-ai.db
      SIDEKICK_ADAPTER_INSTANCE_ID: ${SIDEKICK_WECHAT_HOST_INSTANCE_ID:-wechat-host}
    volumes:
      - sidekick-wechat-host-runtime:/sidekick-data
    networks:
      - memory-platform
      - agent-platform
      - wechat-host

  wechat-peer-ai:
    <<: *wechat-ai
    container_name: sidekick-wechat-peer-ai
    environment:
      <<: *wechat-ai-environment
      SIDEKICK_WECHAT_URL: http://wechat:18088
      SIDEKICK_WECHAT_TOKEN: ${SIDEKICK_WECHAT_PEER_TOKEN:-}
      SIDEKICK_WECHAT_STATE_PATH: /sidekick-data/.sidekick/wechat-peer.db
      SIDEKICK_AI_STATE_PATH: /sidekick-data/.sidekick/wechat-peer-ai.db
      SIDEKICK_ADAPTER_INSTANCE_ID: ${SIDEKICK_WECHAT_PEER_INSTANCE_ID:-wechat-peer}
    volumes:
      - sidekick-wechat-peer-runtime:/sidekick-data
    networks:
      - memory-platform
      - agent-platform
      - wechat-peer

volumes:
  sidekick-runtime:
  sidekick-wechat-host-runtime:
  sidekick-wechat-peer-runtime:

networks:
  memory-platform:
    external: true
    name: memory-platform
  agent-platform:
    external: true
    name: agent-platform
  wechat-host:
    external: true
    name: wechat-host_default
  wechat-peer:
    external: true
    name: wechat-peer_default
