services:
  pi-agent:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    image: sidekick-pi-agent:local
    container_name: sidekick-pi-agent
    environment:
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-none}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4000}
      AI_CONTEXT_WINDOW: ${AI_CONTEXT_WINDOW:-128000}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-90}
      AI_IMAGE_REQUEST_TIMEOUT: ${AI_IMAGE_REQUEST_TIMEOUT:-180}
      TAIBU_MCP_URL: ${TAIBU_MCP_URL:-https://suanming.leishi.xyz/mcp}
      TAIBU_MCP_REQUEST_TIMEOUT_MS: ${TAIBU_MCP_REQUEST_TIMEOUT_MS:-30000}
      PI_HOST: "0.0.0.0"
      PI_PORT: "8790"
      PI_DATA_DIR: /agent-data/.pi-agent
      PI_IDENTITY_ALIAS_KEY: ${PI_IDENTITY_ALIAS_KEY}
      PI_AGENT_TELEGRAM_TOKEN: ${PI_AGENT_TELEGRAM_TOKEN}
      PI_AGENT_ONEBOT_TOKEN: ${PI_AGENT_ONEBOT_TOKEN}
      PI_AGENT_WECHAT_HOST_TOKEN: ${PI_AGENT_WECHAT_HOST_TOKEN}
      PI_AGENT_WECHAT_PEER_TOKEN: ${PI_AGENT_WECHAT_PEER_TOKEN}
      PI_AGENT_PLAYGROUND_TOKEN: ${PI_AGENT_PLAYGROUND_TOKEN}
      PI_AGENT_TELEGRAM_INSTANCE_ID: ${PI_AGENT_TELEGRAM_INSTANCE_ID:-telegram-default}
      PI_AGENT_ONEBOT_INSTANCE_ID: ${PI_AGENT_ONEBOT_INSTANCE_ID:-qq-default}
      PI_AGENT_WECHAT_HOST_INSTANCE_ID: ${PI_AGENT_WECHAT_HOST_INSTANCE_ID:-wechat-host}
      PI_AGENT_WECHAT_PEER_INSTANCE_ID: ${PI_AGENT_WECHAT_PEER_INSTANCE_ID:-wechat-peer}
      PI_AGENT_WECHAT_HOST_SCOPE_PREFIX: ${PI_AGENT_WECHAT_HOST_SCOPE_PREFIX}
      PI_AGENT_WECHAT_PEER_SCOPE_PREFIX: ${PI_AGENT_WECHAT_PEER_SCOPE_PREFIX}
      MEMORY_API_URL: http://memory-gateway:8888
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN}
    init: true
    networks:
      - default
      - memory-platform
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    pids_limit: 256
    ports:
      - "127.0.0.1:${PI_AGENT_EXPOSE_PORT:-18790}:8790"
    volumes:
      - type: bind
        source: ${CODEX_AUTH_FILE:-/dev/null}
        target: /run/secrets/codex-auth.json
        read_only: true
        bind:
          create_host_path: false
      - agent-data:/agent-data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)})
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  agent-playground:
    build:
      context: ../playground
    image: sidekick-agent-playground:local
    container_name: sidekick-agent-playground
    command: ["--host", "0.0.0.0", "--port", "8780"]
    depends_on:
      pi-agent:
        condition: service_healthy
    environment:
      PI_AGENT_URL: http://pi-agent:8790
      PI_AGENT_TOKEN: ${PI_AGENT_PLAYGROUND_TOKEN}
      MEMORY_API_URL: http://memory-gateway:8888
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN}
      PLAYGROUND_CHANNEL_TOKEN: ${SIDEKICK_OPS_TOKEN}
      PLAYGROUND_REQUEST_TIMEOUT: ${PLAYGROUND_REQUEST_TIMEOUT:-300}
      PLAYGROUND_SYSTEM_PROMPT: ${PLAYGROUND_SYSTEM_PROMPT:-}
      PLAYGROUND_CHANNEL_ADAPTER_URLS: ${PLAYGROUND_CHANNEL_ADAPTER_URLS:-}
      PLAYGROUND_CHANNEL_POLL_INTERVAL: ${PLAYGROUND_CHANNEL_POLL_INTERVAL:-2}
      PLAYGROUND_CHANNEL_SOURCE_TIMEOUT: ${PLAYGROUND_CHANNEL_SOURCE_TIMEOUT:-5}
      PLAYGROUND_CHANNEL_BANK_CACHE_TTL: ${PLAYGROUND_CHANNEL_BANK_CACHE_TTL:-15}
    networks:
      - default
      - memory-platform
    expose:
      - "8780"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  agent-data:
    name: pi-agent-data

networks:
  default:
    name: agent-platform
  memory-platform:
    external: true
    name: memory-platform
