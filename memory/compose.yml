services:
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.hindsight
      args:
        HINDSIGHT_CONTROL_PLANE_IMAGE: ${HINDSIGHT_CONTROL_PLANE_IMAGE:-sidekick-hindsight-control-plane:0.8.4-bank-name.2}
    image: sidekick-hindsight:0.8.4-bank-name.2-hardened-r3
    container_name: sidekick-memory-api
    # pg0 uses 512 MB maintenance_work_mem while creating vector indexes.
    shm_size: 1gb
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${MEMORY_LLM_API_KEY}
      HINDSIGHT_API_LLM_MODEL: ${MEMORY_LLM_MODEL}
      HINDSIGHT_API_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL}
      HINDSIGHT_API_LLM_REASONING_EFFORT: ${MEMORY_LLM_REASONING_EFFORT:-low}
      HINDSIGHT_API_RETAIN_LLM_MODEL: ${MEMORY_RETAIN_LLM_MODEL:-${MEMORY_LLM_MODEL}}
      HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: ${MEMORY_RETAIN_LLM_REASONING_EFFORT:-${MEMORY_LLM_REASONING_EFFORT:-low}}
      HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: ${MEMORY_CONSOLIDATION_LLM_MODEL:-${MEMORY_LLM_MODEL}}
      HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: ${MEMORY_CONSOLIDATION_LLM_REASONING_EFFORT:-${MEMORY_LLM_REASONING_EFFORT:-low}}
      HINDSIGHT_API_REFLECT_LLM_MODEL: ${MEMORY_REFLECT_LLM_MODEL:-${MEMORY_LLM_MODEL}}
      HINDSIGHT_API_REFLECT_LLM_REASONING_EFFORT: ${MEMORY_REFLECT_LLM_REASONING_EFFORT:-${MEMORY_LLM_REASONING_EFFORT:-low}}
      HINDSIGHT_API_LLM_TEMPERATURE: none
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-ollama}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${MEMORY_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-http://ollama-embedding-ollama-1:11434/v1}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-1024}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_RETAIN_ENTITY_LOOKUP: full
      HINDSIGHT_API_WORKER_ID: memory-api
    networks:
      - memory-backend
      - ollama-embedding
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8888"
    volumes:
      - memory-data:/home/hindsight/.pg0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8888/health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  memory-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sidekick-memory-gateway:local
    container_name: sidekick-memory-gateway
    command: ["python", "-m", "sidekick.memory_gateway"]
    depends_on:
      memory-api:
        condition: service_healthy
    environment:
      MEMORY_GATEWAY_HOST: 0.0.0.0
      MEMORY_GATEWAY_PORT: "8888"
      MEMORY_GATEWAY_UPSTREAM_URL: http://memory-api:8888
      MEMORY_GATEWAY_TIMEOUT: ${MEMORY_GATEWAY_TIMEOUT:-300}
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN}
    networks:
      - default
      - memory-backend
    ports:
      - "127.0.0.1:${MEMORY_API_EXPOSE_PORT:-18888}:8888"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  memory-data:
    name: memory-hindsight-data

networks:
  default:
    name: memory-platform
  memory-backend:
    name: sidekick-memory-backend
    internal: true
  ollama-embedding:
    external: true
    name: ollama-embedding
