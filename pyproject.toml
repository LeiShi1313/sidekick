[project]
name = "sidekick"
dynamic = ["version"]
description = "Context-aware AI sidekick for conversations, people, and shared knowledge"
authors = [{ name = "Lei Shi", email = "me@leishi.io" }]
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "telethon>=1.44.0",
    "fire>=0.5.0",
    "aiohttp>=3.14.1",
    "aiosqlite>=0.20.0",
    "openai>=2.45.0",
    "Pillow>=12.2.0",
    "croniter>=6.0.0,<7",
    "pypdf>=6.8,<7",
]

[project.optional-dependencies]
legacy-migration = ["zvec>=0.5.1,<0.6"]

[project.scripts]
sidekick = "sidekick.cli:main"
sidekick-memory-migrate = "sidekick.memory_migrate:main"
sidekick-memory-benchmark = "sidekick.memory_benchmark.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/sidekick"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
