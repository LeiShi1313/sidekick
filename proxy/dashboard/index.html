<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f3f5f2">
    <title>Sidekick</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <span class="wordmark">Sidekick</span>
        <span class="environment">Local services</span>
      </div>
    </header>

    <main>
      <div class="page-heading">
        <p class="eyebrow">Service index</p>
        <h1>Sidekick</h1>
      </div>

      <div class="section-grid">
        <nav class="resource-section" aria-labelledby="workspaces-heading">
          <div class="section-heading">
            <h2 id="workspaces-heading">Workspaces</h2>
            <span>1 service</span>
          </div>
          <ul class="resource-list">
            <li class="resource-item resource-item--agent">
              <div>
                <a href="http://playground.sidekick.localhost:18865/">Agent Playground</a>
                <p>Prompt, inspect, and continue agent runs.</p>
              </div>
              <span class="resource-meta">playground</span>
            </li>
          </ul>
        </nav>
      </div>
    </main>
  </body>
</html>
