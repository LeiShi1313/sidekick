services:
  dashboard-proxy:
    image: nginxproxy/nginx-proxy:1.11.0
    container_name: sidekick-dashboard-proxy
    ports:
      - "127.0.0.1:${DASHBOARD_PROXY_EXPOSE_PORT:-18865}:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - agent-platform
      - memory-platform
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
    image: sidekick-dashboard:local
    container_name: sidekick-dashboard
    entrypoint: python
    command: ["-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/dashboard"]
    environment:
      VIRTUAL_HOST: sidekick.localhost
      VIRTUAL_PORT: "8080"
    expose:
      - "8080"
    networks:
      - agent-platform
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  agent-platform:
    external: true
    name: agent-platform
  memory-platform:
    external: true
    name: memory-platform
