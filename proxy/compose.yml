services:
  dashboard-proxy:
    build:
      context: .
    image: sidekick-dashboard-proxy:local
    container_name: sidekick-dashboard-proxy
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      dashboard:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PROXY_EXPOSE_PORT:-18865}:8080"
    networks:
      - agent-platform
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - "--header=Host: sidekick.localhost"
        - http://127.0.0.1:8080/
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
    image: sidekick-dashboard:local
    container_name: sidekick-dashboard
    entrypoint: python
    command: ["-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/dashboard"]
    expose:
      - "8080"
    networks:
      - agent-platform
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  agent-platform:
    external: true
    name: agent-platform
